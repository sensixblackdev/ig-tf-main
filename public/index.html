  <title>Instagram</title>

  <main class="login-shell">
    <section class="brand-panel" aria-label="Apresentação">
      <div class="brand-content">
        <div class="language">Português (Brasil)<span aria-hidden="true"></span></div>
        <img class="brand-image" src="assets/instagram.svg" alt="Instagram">
        <h1>Veja momentos do dia a dia dos</h1>
        <p>seus <span>amigos próximos.</span></p>

        <div class="story-stack" aria-hidden="true">
          <img src="assets/imagens/imagem.png" alt="">
        </div>
      </div>
    </section>

    <section class="form-panel" aria-label="Login">
      <div class="form-wrap">
        <h2>Entrar no Instagram</h2>
        <form id="login-form">
          <div class="input-field">
            <label for="username">Número de celular, nome de usuário ou email</label>
            <input id="username" name="username" type="text" placeholder="Número de celular, nome de usuário ou email" autocomplete="username" required>
          </div>
          <div class="input-field">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
          </div>
          <button class="primary-button" type="submit">Entrar</button>
        </form>
        <a class="forgot-link" href="https://www.instagram.com/accounts/password/reset/">Esqueceu a senha?</a>

        <div class="separator"><span></span><small>ou</small><span></span></div>

          <svg class="facebook-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="11" fill="#0095f6"/>
            <path fill="#ffffff" d="M13.5 12h2.2l.34-2.6h-2.54V7.8c0-.75.21-1.26 1.28-1.26h1.37V4.24c-.24-.03-1.05-.1-2-.1-1.98 0-3.33 1.21-3.33 3.43V9.4H8.5V12h2.32v6.64c.48.07.96.11 1.45.11s.97-.04 1.45-.11V12h-.22z"/>
          </svg>
          Entrar com o Facebook
        </a>
